name: DUSRM schema validation

on:
  push:
    paths:
      - ".github/workflows/dusrm-schema-validation.yml"
      - "schema/**"
      - "conformance/fixtures/**"
      - "scripts/validate_schema_fixtures.py"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - ".github/workflows/dusrm-schema-validation.yml"
      - "schema/**"
      - "conformance/fixtures/**"
      - "scripts/validate_schema_fixtures.py"
      - "requirements-dev.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schema and fixture expectations
        run: python scripts/validate_schema_fixtures.py
