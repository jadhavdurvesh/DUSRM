name: DUSRM SAND OS validation kit

on:
  push:
    branches: [main]
    paths:
      - "adoption/sand-os/**"
      - ".github/workflows/dusrm-sand-os-kit.yml"
  pull_request:
    paths:
      - "adoption/sand-os/**"
      - ".github/workflows/dusrm-sand-os-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-kit:
    name: Verify portable DUSRM kit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adoption/sand-os
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependency
        run: python -m pip install -r requirements.txt
      - name: Verify bundled source integrity
        run: python verify_bundle.py
      - name: Run portable kit regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate SAND OS architecture fixture
        run: python validate.py --report validation-report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dusrm-sand-os-architecture-report
          path: adoption/sand-os/validation-report.json
          if-no-files-found: warn
          retention-days: 30
